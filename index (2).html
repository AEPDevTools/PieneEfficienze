<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifica di piena efficienza – Generatore e-mail</title>
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1d2733;--m:#64748b;--p:#0b5cab;--b:#d5dce6;--ok:#16794c;--w:#b45309;--e:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--c:#1a222d;--t:#e6ebf2;--m:#93a1b5;--p:#5aa2ee;--b:#2c3746;--ok:#4ade80;--w:#fbbf24;--e:#f87171}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--b);flex-wrap:wrap}
h1{font-size:17px;margin:0}main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
button{font:inherit;padding:6px 12px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);cursor:pointer}
button.p{background:var(--p);color:#fff;border-color:var(--p)}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);max-width:100%}
textarea{width:100%;min-height:260px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--m)}.ok{color:var(--ok)}.w{color:var(--w)}.e{color:var(--e)}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--b);font-size:12px;margin:1px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--b);padding:5px 6px;text-align:left;vertical-align:top}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.modal.on{display:flex}.box{background:var(--c);border-radius:10px;padding:16px;width:min(900px,100%)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:var(--p);color:#fff}
.grp.dis{opacity:.7}.big{font-size:15px}
</style></head><body>
<script>
/* ============ CONFIGURAZIONE DATABASE (modificare qui) ============ */
const DB_CONFIG={
  url:"SOSTITUIRE_CON_URL_RAW_GITHUB/database.xlsx", // es. https://raw.githubusercontent.com/UTENTE/REPO/main/database.xlsx
  nome:"Database predefinito (GitHub)",
  versione:"", // opzionale: versione o data aggiornamento
  mappa:{comp:"AEP_COMPETENTE",data:"DATA_FINE_VALIDITA",tens:"CODICE_LIVELLO_TENSIONE",ricerca:"NOME_ELEMENTO_GMD",nome:"NOME_ELEMENTO",tipo:"TIPO_ELEMENTO",tit:"UNITA_TITOLARE_IDUNITATITOLARE",rs:"RAGSOC_TITOLARE"},
  filtri:{comp:"03",tens:"4"} // la data fine validità deve essere vuota
};
const FIELDS={comp:["Codice competente",1],data:["Data fine validità",1],tens:["Livello tensione",1],ricerca:["Codice di ricerca elemento",1],nome:["Nome elemento (per la mail)",1],tipo:["Tipologia elemento",0],tit:["Codice numerico titolare",1],rs:["Ragione sociale nel DB",0]};
const TPL0={subject:"Richiesta verifica piena efficienza elettrodotti dedicati ad alimentazione di vasta porzione di carico per lavori su rete AT della {{LINEA_FUORI_SERVIZIO}}",
body:"Buon pomeriggio,\n\ncome di consueto si richiede di segnalare lo stato degli elettrodotti ed eventuali criticità/anomalie rilevate che compromettano il normale funzionamento, in quanto saranno dedicati all’alimentazione di rilevante porzione di utenza. Nel caso, infatti, di perdita accidentale di tali collegamenti si verificherebbe disalimentazione diffusa d’utenza, con relativi costi di disalimentazione/mitigazione.\n\nNello specifico gli elementi di rete per i quali si chiede la verifica, per quanto di competenza, sono:\n\n{{ELENCO_ELEMENTI}}\n\nper il fuori servizio della {{LINEA_FUORI_SERVIZIO}} prevista per il periodo {{PERIODO_LAVORI}}.\n\nGrazie, un saluto."};
const PH={TITOLARE:"nome del titolare",CODICE_TITOLARE:"codice numerico del titolare",CODICE_RICERCA:"codice ricercato",ELENCO_ELEMENTI:"elenco NOME_ELEMENTO del titolare",LINEA_FUORI_SERVIZIO:"linea fuori servizio",PERIODO_LAVORI:"periodo dei lavori"};

/* ============ STATO E PERSISTENZA ============ */
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const LS="vpe_v1";
let S={mode:"default",cfg:{default:{mappa:{...DB_CONFIG.mappa},filtri:{...DB_CONFIG.filtri}},custom:{mappa:{},filtri:{...DB_CONFIG.filtri}}},
 owners:{},contacts:{},tpl:{...TPL0},linea:"linea 132 kV n. 875 PS Servola-Broletto",periodo:""};
try{const x=JSON.parse(localStorage.getItem(LS)||"null");if(x)S={...S,...x}}catch(e){}
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
let DB={name:"",sheet:"",rows:[],headers:[],ok:false,loaded:"",err:""}; // database in uso
let PEND=null; // database personalizzato in attesa di applicazione {wb,name}
let RES=null,SEL={},DRAFTS=[];
const cfg=()=>S.cfg[S.mode];

/* ============ LETTURA EXCEL ============ */
const needLib=()=>{if(typeof XLSX==="undefined")throw new Error("Libreria SheetJS non disponibile (connessione assente?). Per l'uso offline scarica xlsx.full.min.js e sostituisci l'URL nel tag <script> in fondo al file.")};
function readWB(buf){needLib();return XLSX.read(buf,{type:"array",cellFormula:false,cellDates:false}) } // le formule NON vengono eseguite: si usano i valori in cache
function sheetRows(wb,sh){const ws=wb.Sheets[sh];if(!ws)throw new Error("Foglio non trovato");const a=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
 if(!a.length)throw new Error("Il foglio selezionato è vuoto");return{rows:a,headers:Object.keys(a[0])}}
function guess(headers,mappa){const out={};for(const k in FIELDS){const w=(mappa[k]||DB_CONFIG.mappa[k]||"").toLowerCase();out[k]=headers.find(h=>h.toLowerCase()===w)||""}return out}
async function loadDefault(){
 DB.err="";setStatus("Caricamento del database predefinito…");
 try{if(DB_CONFIG.url.includes("SOSTITUIRE"))throw new Error("URL del database non configurato: modifica DB_CONFIG.url all'inizio del file.");
  const r=await fetch(DB_CONFIG.url+(DB_CONFIG.url.includes("?")?"&":"?")+"t="+Date.now());if(!r.ok)throw new Error("HTTP "+r.status);
  const wb=readWB(await r.arrayBuffer());const sh=wb.SheetNames[0];const{rows,headers}=sheetRows(wb,sh);
  S.mode="default";S.cfg.default.mappa={...guess(headers,S.cfg.default.mappa)};
  DB={name:DB_CONFIG.nome,sheet:sh,rows,headers,ok:true,loaded:new Date().toLocaleString("it-IT"),err:""};save();recompute();
 }catch(e){DB.err="Impossibile caricare il database predefinito: "+e.message+" Puoi caricare un database locale da Impostazioni › Database.";if(!DB.ok)DB.ok=false;render()}}
function applyCustom(sh){ // valida prima di sostituire; in caso di errore conserva il DB precedente
 try{const{rows,headers}=sheetRows(PEND.wb,sh);S.mode="custom";S.cfg.custom.mappa=guess(headers,S.cfg.custom.mappa);
  DB={name:PEND.name,sheet:sh,rows,headers,ok:true,loaded:new Date().toLocaleString("it-IT"),err:""};save();recompute();return true}
 catch(e){alert("Database non applicato (resta in uso il precedente): "+e.message);return false}}

/* ============ NORMALIZZAZIONE E FILTRI ============ */
const nv=v=>v==null?"":String(v).trim();
const isNum=s=>/^-?\d+(\.\d+)?$/.test(s);
const eq=(a,b)=>{a=nv(a);b=nv(b);if(a.toLowerCase()===b.toLowerCase())return true;return isNum(a)&&isNum(b)&&Number(a)===Number(b)}; // "03" = 3
const empty=v=>nv(v)===""; 
function recompute(){
 const m=cfg().mappa,f=cfg().filtri,miss=[];let anomalie=[];
 for(const k in FIELDS)if(FIELDS[k][1]&&!(m[k]&&DB.headers.includes(m[k])))miss.push(FIELDS[k][0]);
 DB.missing=miss;DB.valid=[];
 if(!miss.length){DB.valid=DB.rows.filter(r=>eq(r[m.comp],f.comp)&&empty(r[m.data])&&eq(r[m.tens],f.tens))}
 DB.noTit=DB.valid.filter(r=>empty(r[m.tit])).length;
 RES=null;SEL={};render();if($("#st.on"))renderSettings()}
const cod=r=>nv(cfg_m().tit&&r[cfg_m().tit]);const cfg_m=()=>cfg().mappa;

/* ============ RICERCA E RAGGRUPPAMENTO ============ */
function search(q,partial){q=nv(q);const m=cfg_m();if(!q||DB.missing?.length)return null;
 const ex=[],pa=[];DB.valid.forEach(r=>{const v=nv(r[m.ricerca]);if(eq(v,q))ex.push(r);else if(partial&&v.toLowerCase().includes(q.toLowerCase()))pa.push(r)});
 return{q,ex,pa}}
const ownerName=c=>S.owners[c]||"";
function group(rows,q){const m=cfg_m(),g={};
 rows.forEach(r=>{const c=nv(r[m.tit]),n=c?ownerName(c):"",key=n?"N:"+n:"X:"+(c||"(senza codice)");
  const o=g[key]||(g[key]={name:n||"Titolare non identificato",ident:!!n,codes:new Set(),items:[],q});o.codes.add(c||"(senza codice)");o.items.push(r)});
 return Object.values(g).sort((a,b)=>b.ident-a.ident||a.name.localeCompare(b.name))}
const types=items=>{const m=cfg_m(),t={};items.forEach(r=>{const k=nv(r[m.tipo])||"?";t[k]=(t[k]||0)+1});return t};
const uniq=a=>[...new Set(a)];

/* ============ RENDER PRINCIPALE ============ */
function setStatus(t){$("#dbs").innerHTML=esc(t)}
function render(){
 let h="";const m=cfg_m();
 if(DB.err)h+=`<div class="card e">${esc(DB.err)}</div>`;
 if(DB.ok){h+=`<div class="card"><b>${esc(DB.name)}</b> · foglio «${esc(DB.sheet)}» · ${DB.rows.length} righe lette · <b>${DB.valid.length}</b> superano i filtri <span class="m">(la ricerca opera solo su queste)</span>
 <div class="m">Ultimo caricamento: ${esc(DB.loaded)}${S.mode==="default"&&DB_CONFIG.versione?" · versione "+esc(DB_CONFIG.versione):""}</div>
 ${DB.missing.length?`<div class="e">Colonne indispensabili non configurate: ${DB.missing.map(esc).join(", ")}. Vai in Impostazioni › Configura DB.</div>`:""}
 ${DB.noTit?`<div class="w">${DB.noTit} righe filtrate senza codice titolare.</div>`:""}</div>`}
 else if(!DB.err)h+=`<div class="card">Caricamento database…</div>`;
 h+=`<div class="card"><div class="row"><input id="q" placeholder="Codice elemento (es. 670)" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')doSearch()"><label><input type="checkbox" id="part" ${window._part?"checked":""}> mostra anche parziali</label><button class="p" onclick="doSearch()" ${DB.ok&&!DB.missing?.length?"":"disabled"}>Cerca</button></div></div><div id="res"></div>`;
 $("#main").innerHTML=h;if(window._q)$("#q").value=window._q;renderRes()}
function doSearch(){window._q=$("#q").value;window._part=$("#part").checked;RES=search(window._q,window._part);SEL={};renderRes()}
function renderRes(){
 const el=$("#res");if(!el)return;if(!RES){el.innerHTML="";return}
 const{ex,pa,q}=RES;let h=`<div class="card big"><b>${ex.length}</b> corrispondenze esatte per «${esc(q)}»${pa.length?` · <span class="w">${pa.length} parziali</span>`:""}</div>`;
 if(!ex.length&&!pa.length)h+=`<div class="card m">Nessun elemento trovato tra le righe che superano i filtri.</div>`;
 const mk=(rows,tag)=>group(rows,q).forEach((g,i)=>{const id=tag+i;g._id=id;(RES.g=RES.g||{})[id]=g});RES.g={};
 mk(ex,"e");mk(pa,"p");
 const drawG=(g,tag)=>{const m=cfg_m(),id=g._id,tt=types(g.items),cts=g.ident?(S.contacts[g.name]||[]):[],s=SEL[id]||(SEL[id]={on:false,c:{}});
  return `<div class="card grp ${g.ident?"":"dis"}"><div class="row"><input type="checkbox" ${g.ident?"":"disabled"} ${s.on?"checked":""} onchange="SEL['${id}'].on=this.checked;updGen()">
  <b class="big">${esc(g.name)}</b> <span class="tag">cod. ${[...g.codes].map(esc).join(", ")}</span><span class="tag">${g.items.length} elementi</span>${Object.entries(tt).map(([k,v])=>`<span class="tag">${esc(k)}: ${v}</span>`).join("")}${tag==="p"?'<span class="tag w">parziale</span>':""}</div>
  ${g.ident?"":`<div class="w">Associa il codice in Impostazioni › Associa codici titolare per poterlo selezionare.</div>`}
  ${g.codes.size>1&&g.ident?`<div class="m">Più codici associati a questo nome: verifica nelle impostazioni.</div>`:""}
  <table>${g.items.map(r=>`<tr><td>${esc(r[m.ricerca])}</td><td>${esc(r[m.nome])}</td><td>${esc(r[m.tipo])}</td></tr>`).join("")}</table>
  ${g.ident?(cts.length?`<table><tr><th>Contatto</th><th>A</th><th>CC</th></tr>${cts.map((c,i)=>`<tr><td>${esc(c.name||"")} ${esc(c.email)}</td><td><input type="checkbox" ${s.c[i]?.a?"checked":""} onchange="setC('${id}',${i},'a',this.checked)"></td><td><input type="checkbox" ${s.c[i]?.c?"checked":""} onchange="setC('${id}',${i},'c',this.checked)"></td></tr>`).join("")}</table>`:`<div class="w">Nessun destinatario configurato (Impostazioni › Destinatari). Potrai inserirli a mano nell'anteprima.</div>`):""}</div>`};
 const gs=Object.values(RES.g);
 h+=gs.filter(g=>g._id[0]==="e").map(g=>drawG(g,"e")).join("");
 if(pa.length)h+=`<h3>Corrispondenze parziali</h3>`+gs.filter(g=>g._id[0]==="p").map(g=>drawG(g,"p")).join("");
 h+=`<div class="card"><div class="row"><label>Linea fuori servizio <input id="lin" value="${esc(S.linea)}" size="40" onchange="S.linea=this.value;save()"></label><label>Periodo lavori <input id="per" value="${esc(S.periodo)}" size="28" placeholder="obbligatorio" onchange="S.periodo=this.value;save()"></label><button class="p" id="gen" onclick="makeDrafts()">Prepara bozze</button></div><div class="m" id="gensum"></div></div>`;
 el.innerHTML=h;updGen()}
function setC(id,i,k,v){const s=SEL[id];(s.c[i]=s.c[i]||{})[k]=v}
function updGen(){const n=Object.values(SEL).filter(s=>s.on).length;const b=$("#gen");if(b)b.disabled=!n;const g=$("#gensum");if(g)g.textContent=n?n+" titolari selezionati: verrà preparata una bozza per ciascuno.":"Seleziona almeno un titolare."}

/* ============ MODELLO E BOZZE ============ */
function fill(t,v){return t.replace(/\{\{(\w+)\}\}/g,(x,k)=>k in v?v[k]:x)}
function makeDrafts(){
 if(!nv(S.periodo)){alert("Inserisci il periodo dei lavori prima di generare le bozze.");$("#per").focus();return}
 if(!nv(S.linea)){alert("Inserisci la linea fuori servizio.");return}
 const m=cfg_m();DRAFTS=[];
 Object.entries(SEL).filter(([,s])=>s.on).forEach(([id,s])=>{const g=RES.g[id],cts=S.contacts[g.name]||[];
  const els=uniq(g.items.map(r=>nv(r[m.nome])).filter(Boolean));
  const v={TITOLARE:g.name,CODICE_TITOLARE:[...g.codes].join(", "),CODICE_RICERCA:RES.q,ELENCO_ELEMENTI:els.map(e=>"- "+e+";").join("\n"),LINEA_FUORI_SERVIZIO:S.linea,PERIODO_LAVORI:S.periodo};
  DRAFTS.push({titolare:g.name,to:cts.filter((c,i)=>s.c[i]?.a).map(c=>c.email).join(", "),cc:cts.filter((c,i)=>s.c[i]?.c).map(c=>c.email).join(", "),subject:fill(S.tpl.subject,v),body:fill(S.tpl.body,v),n:els.length})});
 renderPrev();$("#pv").classList.add("on")}
function renderPrev(){
 $("#pvb").innerHTML=`<h2>Anteprima bozze (${DRAFTS.length})</h2><div class="m">Le modifiche valgono solo per la singola bozza e non alterano il modello salvato.</div>`+DRAFTS.map((d,i)=>`<div class="card"><b>${esc(d.titolare)}</b> <span class="tag">${d.n} elementi</span>
 ${d.to?"":'<div class="w">Nessun destinatario in A.</div>'}
 <p>A: <input style="width:100%" value="${esc(d.to)}" onchange="DRAFTS[${i}].to=this.value"></p><p>CC: <input style="width:100%" value="${esc(d.cc)}" onchange="DRAFTS[${i}].cc=this.value"></p>
 <p>Oggetto: <input style="width:100%" value="${esc(d.subject)}" onchange="DRAFTS[${i}].subject=this.value"></p><textarea onchange="DRAFTS[${i}].body=this.value">${esc(d.body)}</textarea>
 <div class="row"><button class="p" onclick="openMail(${i})">Apri bozza in Outlook</button><button onclick="copyMail(${i})">Copia e-mail</button></div><div class="m" id="msg${i}"></div></div>`).join("")+`<button onclick="$('#pv').classList.remove('on')">Chiudi</button>`}
function openMail(i){const d=DRAFTS[i],list=s=>s.split(/[;,]/).map(x=>x.trim()).filter(Boolean).join(",");
 const nl=t=>encodeURIComponent(t.replace(/\r?\n/g,"\r\n"));
 let u="mailto:"+list(d.to).split(",").map(encodeURIComponent).join(",")+"?subject="+nl(d.subject)+(d.cc?"&cc="+list(d.cc).split(",").map(encodeURIComponent).join(","):"")+"&body="+nl(d.body);
 const w=u.length>1900?" Attenzione: contenuto molto lungo, il client potrebbe troncarlo; usa «Copia e-mail» per sicurezza.":"";
 location.href=u;$("#msg"+i).innerHTML="Richiesta di apertura inviata al client di posta (il browser non può confermare che la bozza sia stata aperta)."+w}
async function copyMail(i){const d=DRAFTS[i],t=`A: ${d.to}\nCC: ${d.cc}\nOggetto: ${d.subject}\n\n${d.body}`;
 try{await navigator.clipboard.writeText(t);$("#msg"+i).textContent="Copiato negli appunti."}
 catch(e){$("#msg"+i).innerHTML='Copia automatica non disponibile: seleziona e copia il testo qui sotto.<textarea style="min-height:120px" readonly onfocus="this.select()">'+esc(t)+"</textarea>"}}

/* ============ IMPOSTAZIONI ============ */
let TAB="db";
function openSettings(t){TAB=t||TAB;$("#st").classList.add("on");renderSettings()}
function renderSettings(){
 const T={db:"Database",cols:"Configura DB",own:"Associa codici titolare",rec:"Destinatari e-mail",tpl:"Modello e-mail"};
 let h=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Impostazioni</h2><button onclick="$('#st').classList.remove('on');render()">Chiudi</button></div><div class="tabs">${Object.entries(T).map(([k,v])=>`<button class="${k===TAB?"on":""}" onclick="TAB='${k}';renderSettings()">${v}</button>`).join("")}</div>`;
 h+=({db:tDb,cols:tCols,own:tOwn,rec:tRec,tpl:tTpl})[TAB]();$("#stb").innerHTML=h}
function tDb(){return `<p>In uso: <b>${esc(DB.name||"—")}</b> (${S.mode==="default"?"predefinito":"personalizzato"})</p>
 <div class="row"><button onclick="loadDefault().then(renderSettings)">Ricarica database GitHub</button><button onclick="loadDefault().then(renderSettings)">Ripristina database predefinito</button></div>
 <h3>Database personalizzato</h3><p class="m">Il file resta nel browser, non viene inviato a nessun servizio e non viene conservato alla chiusura: andrà ricaricato alla riapertura (le configurazioni restano salvate).</p>
 <input type="file" accept=".xlsx,.xls" onchange="pickFile(this.files[0])">
 ${PEND?`<p>File: ${esc(PEND.name)} · Foglio: <select id="shs">${PEND.wb.SheetNames.map(s=>`<option>${esc(s)}</option>`).join("")}</select> <button class="p" onclick="if(applyCustom($('#shs').value))renderSettings()">Applica</button></p>`:""}`}
async function pickFile(f){if(!f)return;try{const wb=readWB(await f.arrayBuffer());PEND={wb,name:f.name};renderSettings()}catch(e){alert("File non leggibile (database precedente conservato): "+e.message)}}
function tCols(){if(!DB.ok)return "<p>Carica prima un database.</p>";const c=cfg(),m=c.mappa;
 return `<table><tr><th>Campo</th><th>Colonna</th><th>Anteprima</th><th>Stato</th></tr>${Object.entries(FIELDS).map(([k,[l,req]])=>{const col=m[k],ok=col&&DB.headers.includes(col),pv=ok?uniq(DB.rows.slice(0,200).map(r=>nv(r[col])).filter(Boolean)).slice(0,3).join(" | "):"";
 return `<tr><td>${l}${req?" *":""}</td><td><select onchange="cfg().mappa['${k}']=this.value;save();recompute()"><option value="">— nessuna —</option>${DB.headers.map(h=>`<option ${h===col?"selected":""}>${esc(h)}</option>`).join("")}</select></td><td class="m">${esc(pv)}</td><td class="${ok?"ok":req?"e":"w"}">${ok?"OK":req?"Mancante (indispensabile)":"Mancante"}</td></tr>`}).join("")}</table>
 <h3>Filtri</h3><div class="row"><label>Codice competente = <input value="${esc(c.filtri.comp)}" size="6" onchange="cfg().filtri.comp=this.value;save();recompute()"></label><label>Livello tensione = <input value="${esc(c.filtri.tens)}" size="6" onchange="cfg().filtri.tens=this.value;save();recompute()"></label><span>Data fine validità: <b>vuota</b></span></div>
 <p class="m">Righe che superano i filtri: ${DB.valid.length} su ${DB.rows.length}.</p>`}
function ownerInfo(){const m=cfg_m(),o={};DB.valid.forEach(r=>{const c=nv(r[m.tit]);if(!c)return;const e=o[c]||(o[c]={c,n:0,rs:{},ex:[],ty:{}});e.n++;const rs=nv(r[m.rs]);if(rs)e.rs[rs]=(e.rs[rs]||0)+1;const nm=nv(r[m.nome]);if(nm&&e.ex.length<3&&!e.ex.includes(nm))e.ex.push(nm);const t=nv(r[m.tipo]);if(t)e.ty[t]=1});return o}
function tOwn(){if(!DB.ok||DB.missing.length)return "<p>Configura prima il database.</p>";const o=ownerInfo(),cs=Object.keys(o).sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
 const inRes=RES?new Set([...RES.ex,...RES.pa].map(r=>nv(r[cfg_m().tit]))):new Set(),f=(window._of||"").toLowerCase();
 const nA=cs.filter(c=>S.owners[c]).length,gone=Object.keys(S.owners).filter(c=>!o[c]);
 return `<p><b>${cs.length}</b> codici distinti · <b>${[...inRes].filter(c=>c).length}</b> nella ricerca corrente · <b>${nA}</b> associati · <b>${cs.length-nA}</b> da associare · <b>${DB.noTit}</b> righe senza codice</p>
 ${gone.length?`<p class="w">Associazioni di codici non presenti in questo database: ${gone.map(esc).join(", ")}</p>`:""}
 <input placeholder="Cerca codice o nome…" value="${esc(window._of||"")}" onchange="window._of=this.value;renderSettings()">
 <table><tr><th>Codice</th><th>RAGSOC nel DB</th><th>Elementi</th><th>Titolare</th><th></th></tr>${cs.filter(c=>!f||c.toLowerCase().includes(f)||(S.owners[c]||"").toLowerCase().includes(f)).map(c=>{const e=o[c],rs=Object.entries(e.rs).sort((a,b)=>b[1]-a[1]),disc=rs.length>1;
  const prop=!S.owners[c]&&rs.length===1?rs[0][0]:"";
  return `<tr><td>${esc(c)}</td><td>${rs.length?rs.map(([k,v])=>`${esc(k)} (${v})`).join("<br>"):'<span class="m">—</span>'}${disc?'<div class="w">Valori discordanti: scegli tu.</div>':""}</td>
  <td>${e.n} ${Object.keys(e.ty).map(t=>`<span class="tag">${esc(t)}</span>`).join("")}<div class="m">${e.ex.map(esc).join("; ")}</div></td>
  <td><input id="o_${esc(c)}" value="${esc(S.owners[c]||prop)}" placeholder="${prop?"proposta":""}"></td><td><button onclick="setOwner('${esc(c)}')">${prop?"Conferma":"Salva"}</button> ${S.owners[c]?`<button onclick="delete S.owners['${esc(c)}'];save();recompute();renderSettings()">Elimina</button>`:""}</td></tr>`}).join("")}</table>`}
function setOwner(c){const v=nv(document.getElementById("o_"+c).value);if(v)S.owners[c]=v;else delete S.owners[c];save();const r=RES;recompute();RES=r;renderSettings()}
function tRec(){const names=uniq(Object.values(S.owners)).sort();if(!names.length)return "<p>Associa prima almeno un codice a un titolare.</p>";
 return names.map(n=>{const l=S.contacts[n]||[];return `<div class="card"><b>${esc(n)}</b><table>${l.map((c,i)=>`<tr><td>${esc(c.name||"")}</td><td>${esc(c.email)}</td><td><button onclick="S.contacts['${esc(n)}'].splice(${i},1);save();renderSettings()">Elimina</button></td></tr>`).join("")}</table>
 <div class="row"><input id="cn_${esc(n)}" placeholder="Nome (facoltativo)"><input id="ce_${esc(n)}" placeholder="E-mail"><button onclick="addC('${esc(n)}')">Aggiungi</button></div>${l.length?"":'<div class="w">Nessun destinatario configurato.</div>'}</div>`}).join("")}
function addC(n){const e=nv(document.getElementById("ce_"+n).value);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e)){alert("Indirizzo e-mail non valido");return}(S.contacts[n]=S.contacts[n]||[]).push({name:nv(document.getElementById("cn_"+n).value),email:e});save();renderSettings()}
function tTpl(){return `<p>Oggetto</p><input style="width:100%" value="${esc(S.tpl.subject)}" onchange="S.tpl.subject=this.value;save()"><p>Corpo</p><textarea onchange="S.tpl.body=this.value;save()">${esc(S.tpl.body)}</textarea>
 <div class="row"><button onclick="if(confirm('Ripristinare il modello predefinito?')){S.tpl={...TPL0};save();renderSettings()}">Ripristina modello predefinito</button></div>
 <h3>Segnaposto</h3><table>${Object.entries(PH).map(([k,v])=>`<tr><td><code>{{${k}}}</code></td><td>${v}</td></tr>`).join("")}</table>`}
