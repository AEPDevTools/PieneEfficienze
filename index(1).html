<!DOCTYPE html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verifica di piena efficienza – Generatore e-mail</title>
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#1d2733;--m:#64748b;--p:#0b5cab;--b:#d5dce6;--ok:#16794c;--w:#b45309;--e:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--c:#1a222d;--t:#e6ebf2;--m:#93a1b5;--p:#5aa2ee;--b:#2c3746;--ok:#4ade80;--w:#fbbf24;--e:#f87171}}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,sans-serif;background:var(--bg);color:var(--t)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;background:var(--c);border-bottom:1px solid var(--b);flex-wrap:wrap}
h1{font-size:17px;margin:0}main{max-width:1000px;margin:0 auto;padding:16px}
.card{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:14px;margin-bottom:14px}
button{font:inherit;padding:6px 12px;border:1px solid var(--b);border-radius:6px;background:var(--c);color:var(--t);cursor:pointer}
button.p{background:var(--p);color:#fff;border-color:var(--p)}button:disabled{opacity:.5;cursor:not-allowed}
input,select,textarea{font:inherit;padding:6px 8px;border:1px solid var(--b);border-radius:6px;background:var(--bg);color:var(--t);max-width:100%}
textarea{width:100%;min-height:260px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m{color:var(--m)}.ok{color:var(--ok)}.w{color:var(--w)}.e{color:var(--e)}
.tag{display:inline-block;padding:1px 7px;border-radius:9px;background:var(--bg);border:1px solid var(--b);font-size:12px;margin:1px}
table{border-collapse:collapse;width:100%}td,th{border-bottom:1px solid var(--b);padding:5px 6px;text-align:left;vertical-align:top}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:20px;z-index:9}
.modal.on{display:flex}.box{background:var(--c);border-radius:10px;padding:16px;width:min(900px,100%)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0}.tabs button.on{background:var(--p);color:#fff}
.grp.dis{opacity:.7}.big{font-size:15px}
.bar{position:sticky;bottom:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--c);border:1px solid var(--b);border-radius:10px;padding:10px 14px;margin-bottom:14px;box-shadow:0 -2px 8px #0002}
.cfl{border-left:3px solid var(--w);padding-left:10px;margin:8px 0}td.k{width:30px}details{margin-top:6px}summary{cursor:pointer}
</style></head><body>
<script>
/* ============ CONFIGURAZIONE DATABASE (modificare qui) ============ */
/* Il database viene caricato SOLO da un file Excel scelto dall'utente sul proprio computer. */
const DB_CONFIG={
  nome:"Database locale",
  mappa:{comp:"AEP_COMPETENTE",data:"DATA_FINE_VALIDITA",tens:"CODICE_LIVELLO_TENSIONE",ricerca:"NOME_ELEMENTO_GMD",nome:"NOME_ELEMENTO",tipo:"TIPO_ELEMENTO",tit:"UNITA_TITOLARE_IDUNITATITOLARE",rs:"RAGSOC_TITOLARE"},
  filtri:{comp:"03",tens:"4"} // la data fine validità deve essere vuota
};
const FIELDS={comp:["Codice competente",1],data:["Data fine validità",1],tens:["Livello tensione",1],ricerca:["Codice di ricerca elemento",1],nome:["Nome elemento (per la mail)",1],tipo:["Tipologia elemento",0],tit:["Codice numerico titolare",1],rs:["Ragione sociale nel DB",0]};
const TPL0={subject:"Richiesta verifica piena efficienza elettrodotti dedicati ad alimentazione di vasta porzione di carico per lavori su rete AT della {{LINEA_FUORI_SERVIZIO}}",
body:"Buon pomeriggio,\n\ncome di consueto si richiede di segnalare lo stato degli elettrodotti ed eventuali criticità/anomalie rilevate che compromettano il normale funzionamento, in quanto saranno dedicati all’alimentazione di rilevante porzione di utenza. Nel caso, infatti, di perdita accidentale di tali collegamenti si verificherebbe disalimentazione diffusa d’utenza, con relativi costi di disalimentazione/mitigazione.\n\nNello specifico gli elementi di rete per i quali si chiede la verifica, per quanto di competenza, sono:\n\n{{ELENCO_ELEMENTI}}\n\nper il fuori servizio della {{LINEA_FUORI_SERVIZIO}} prevista per il periodo {{PERIODO_LAVORI}}.\n\nGrazie, un saluto."};
const PH={TITOLARE:"nome del titolare",CODICE_TITOLARE:"codice numerico del titolare",CODICE_RICERCA:"codici ricercati (uno o più) degli elementi del titolare",ELENCO_ELEMENTI:"elenco NOME_ELEMENTO del titolare",LINEA_FUORI_SERVIZIO:"linea fuori servizio",PERIODO_LAVORI:"periodo dei lavori"};
const CFG_FMT="vpe-config",CFG_VER=1; // formato e versione del file di configurazione esportato
const ML0={on:true,name:"Mailing list ufficio",email:"",def:""}; // mailing list globale dell'ufficio (def: ""=non selezionato, "A", "CC")

/* ============ STATO E PERSISTENZA ============ */
const $=s=>document.querySelector(s), esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const js=s=>esc(JSON.stringify(String(s))); // stringa JS sicura dentro un attributo HTML
const LS="vpe_v1";
let S={cfg:{mappa:{...DB_CONFIG.mappa},filtri:{...DB_CONFIG.filtri}},
 owners:{},contacts:{},tpl:{...TPL0},linea:"linea 132 kV n. 875 PS Servola-Broletto",periodo:"",ml:{...ML0},mlSel:{}};
try{const x=JSON.parse(localStorage.getItem(LS)||"null");if(x)S={...S,...x}}catch(e){}
(function migra(){ // compatibilità con la versione precedente (configurazione colonne per "default"/"custom")
 let c=S.cfg;if(c&&(c.default||c.custom))c=c[S.mode]||c.default||c.custom;
 S.cfg={mappa:{...DB_CONFIG.mappa,...(c&&c.mappa||{})},filtri:{...DB_CONFIG.filtri,...(c&&c.filtri||{})}};
 delete S.mode;S.owners=S.owners||{};S.contacts=S.contacts||{};S.mlSel=S.mlSel||{};S.ml={...ML0,...(S.ml||{})};S.tpl={...TPL0,...(S.tpl||{})}})();
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}};
let DB={name:"",sheet:"",rows:[],headers:[],ok:false,loaded:"",err:"",missing:[],valid:[],noTit:0}; // database in uso (solo in memoria)
let PEND=null; // file Excel scelto in attesa di applicazione {wb,name}
let RES=null,SEL=new Set(),DRAFTS=[];
let CART=[],REV={},STAGE="cart",RGS=[],RN=[],IMP=null,IMPC=[],CFGMSG="",TAB="db"; // CART: carrello temporaneo (solo in memoria, mai esportato)
const cfg=()=>S.cfg;
const isMail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e);
const numCmp=(a,b)=>a.localeCompare(b,undefined,{numeric:true});

/* ============ LETTURA EXCEL ============ */
const needLib=()=>{if(typeof XLSX==="undefined")throw new Error("Libreria SheetJS non disponibile (connessione assente?). Per l'uso offline scarica xlsx.full.min.js e sostituisci l'URL nel tag <script> in fondo al file.")};
function readWB(buf){needLib();return XLSX.read(buf,{type:"array",cellFormula:false,cellDates:false}) } // le formule NON vengono eseguite: si usano i valori in cache
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
 h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function sheetRows(wb,sh){const ws=wb.Sheets[sh];if(!ws)throw new Error("Foglio non trovato");const a=XLSX.utils.sheet_to_json(ws,{defval:"",raw:true});
 if(!a.length)throw new Error("Il foglio selezionato è vuoto");
 const seen={}; // chiave stabile di riga (__k): hash del contenuto + progressivo tra righe identiche; non enumerabile, quindi non compare tra le colonne
 a.forEach(r=>{const h=hash(JSON.stringify(Object.values(r))),n=seen[h]=(seen[h]||0)+1;Object.defineProperty(r,"__k",{value:h+"-"+n})});
 return{rows:a,headers:Object.keys(a[0])}}
function guess(headers,mappa){const out={};for(const k in FIELDS){const w=(mappa[k]||DB_CONFIG.mappa[k]||"").toLowerCase();out[k]=headers.find(h=>h.toLowerCase()===w)||""}return out}
function applyCustom(sh){ // valida prima di sostituire; in caso di errore conserva il DB precedente
 try{const{rows,headers}=sheetRows(PEND.wb,sh);S.cfg.mappa=guess(headers,S.cfg.mappa);
  DB={name:PEND.name,sheet:sh,rows,headers,ok:true,loaded:new Date().toLocaleString("it-IT"),err:""};save();recompute();return true}
 catch(e){alert("Database non applicato (resta in uso il precedente): "+e.message);return false}}
function loadBox(p){return `<input type="file" accept=".xlsx,.xls" onchange="pickFile(this.files[0])">
 ${PEND?`<p>File: ${esc(PEND.name)} · Foglio: <select id="shs_${p}">${PEND.wb.SheetNames.map(s=>`<option>${esc(s)}</option>`).join("")}</select> <button class="p" onclick="applyCustom($('#shs_${p}').value)">Applica</button></p>`:""}`}
async function pickFile(f){if(!f)return;try{const wb=readWB(await f.arrayBuffer());PEND={wb,name:f.name};render();if($("#st.on"))renderSettings()}catch(e){alert("File non leggibile (database precedente conservato): "+e.message)}}

/* ============ NORMALIZZAZIONE E FILTRI ============ */
const nv=v=>v==null?"":String(v).trim();
const isNum=s=>/^-?\d+(\.\d+)?$/.test(s);
const eq=(a,b)=>{a=nv(a);b=nv(b);if(a.toLowerCase()===b.toLowerCase())return true;return isNum(a)&&isNum(b)&&Number(a)===Number(b)}; // "03" = 3
const empty=v=>nv(v)==="";
function recompute(){
 const m=cfg().mappa,f=cfg().filtri,miss=[];
 for(const k in FIELDS)if(FIELDS[k][1]&&!(m[k]&&DB.headers.includes(m[k])))miss.push(FIELDS[k][0]);
 DB.missing=miss;DB.valid=[];
 if(!miss.length){DB.valid=DB.rows.filter(r=>eq(r[m.comp],f.comp)&&empty(r[m.data])&&eq(r[m.tens],f.tens))}
 DB.noTit=DB.valid.filter(r=>empty(r[m.tit])).length;
 RES=null;SEL=new Set();render();if($("#st.on"))renderSettings();updCartBtn();if($("#ct.on"))renderCart()}
const cod=r=>nv(cfg_m().tit&&r[cfg_m().tit]);const cfg_m=()=>cfg().mappa;

/* ============ RICERCA E RAGGRUPPAMENTO ============ */
function search(q,partial){q=nv(q);const m=cfg_m();if(!q||DB.missing?.length)return null;
 const ex=[],pa=[];DB.valid.forEach(r=>{const v=nv(r[m.ricerca]);if(eq(v,q))ex.push(r);else if(partial&&v.toLowerCase().includes(q.toLowerCase()))pa.push(r)});
 return{q,ex,pa}}
const ownerName=c=>S.owners[c]||"";
function group(rows,q){const m=cfg_m(),g={};
 rows.forEach(r=>{const c=nv(r[m.tit]),n=c?ownerName(c):"",key=n?"N:"+n:"X:"+(c||"(senza codice)");
  const o=g[key]||(g[key]={name:n||"Titolare non identificato",ident:!!n,codes:new Set(),items:[],q});o.codes.add(c||"(senza codice)");o.items.push(r)});
 return Object.values(g).sort((a,b)=>b.ident-a.ident||a.name.localeCompare(b.name))}
const types=items=>{const m=cfg_m(),t={};items.forEach(r=>{const k=nv(r[m.tipo])||"?";t[k]=(t[k]||0)+1});return t};
const uniq=a=>[...new Set(a)];
const cartHas=k=>CART.some(x=>x.key===k);

/* ============ RENDER PRINCIPALE ============ */
function setStatus(t){$("#dbs").innerHTML=esc(t)}
function render(){
 let h="";const m=cfg_m();
 if(DB.err)h+=`<div class="card e">${esc(DB.err)}</div>`;
 if(DB.ok){h+=`<div class="card"><b>${esc(DB.name)}</b> · foglio «${esc(DB.sheet)}» · ${DB.rows.length} righe lette · <b>${DB.valid.length}</b> superano i filtri <span class="m">(la ricerca opera solo su queste)</span>
 <div class="m">Ultimo caricamento: ${esc(DB.loaded)}</div>
 ${DB.missing.length?`<div class="e">Colonne indispensabili non configurate: ${DB.missing.map(esc).join(", ")}. Vai in Impostazioni › Configura DB.</div>`:""}
 ${DB.noTit?`<div class="w">${DB.noTit} righe filtrate senza codice titolare.</div>`:""}</div>`}
 else h+=`<div class="card"><b>Carica il database Excel</b><p class="m">Seleziona dal tuo computer il file .xlsx del database. Il file viene elaborato solo in questo browser: non viene inviato a nessun servizio e non viene conservato alla chiusura, quindi andrà ricaricato a ogni apertura (le configurazioni restano salvate).</p>${loadBox("m")}</div>`;
 h+=`<div class="card"><div class="row"><input id="q" placeholder="Codice elemento (es. 670)" style="flex:1;min-width:180px" onkeydown="if(event.key==='Enter')doSearch()"><label><input type="checkbox" id="part" ${window._part?"checked":""}> mostra anche parziali</label><button class="p" onclick="doSearch()" ${DB.ok&&!DB.missing?.length?"":"disabled"}>Cerca</button></div></div><div id="res"></div>`;
 $("#main").innerHTML=h;if(window._q)$("#q").value=window._q;
 setStatus(DB.ok?DB.name+" · "+DB.valid.length+" elementi validi":"Nessun database caricato");renderRes()}
function doSearch(){
 if(!DB.ok||DB.missing?.length)return;
 if(SEL.size&&!confirm(`Hai ${SEL.size} elementi selezionati non ancora aggiunti al carrello: una nuova ricerca scarta la selezione. Continuare?`))return;
 window._q=$("#q").value;window._part=$("#part").checked;window._am="";RES=search(window._q,window._part);SEL=new Set();renderRes()}
function renderRes(){
 const el=$("#res");if(!el)return;if(!RES){el.innerHTML="";return}
 const{ex,pa,q}=RES;let h=`<div class="card big"><b>${ex.length}</b> corrispondenze esatte per «${esc(q)}»${pa.length?` · <span class="w">${pa.length} parziali</span>`:""}</div>`;
 if(!ex.length&&!pa.length)h+=`<div class="card m">Nessun elemento trovato tra le righe che superano i filtri.</div>`;
 RES.g={};RES.by={};
 const mk=(rows,tag)=>group(rows,q).forEach((g,i)=>{g._id=tag+i;RES.g[g._id]=g;g.items.forEach(r=>{RES.by[r.__k]=g._id})});
 mk(ex,"e");mk(pa,"p");
 const drawG=(g,tag)=>{const m=cfg_m(),id=g._id,tt=types(g.items);
  return `<div class="card grp ${g.ident?"":"dis"}"><div class="row"><input type="checkbox" id="gc_${id}" title="Seleziona/deseleziona tutti gli elementi del titolare" onchange="selGroup('${id}',this.checked)">
  <b class="big">${esc(g.name)}</b> <span class="tag">cod. ${[...g.codes].map(esc).join(", ")}</span><span class="tag">${g.items.length} elementi trovati</span>${Object.entries(tt).map(([k,v])=>`<span class="tag">${esc(k)}: ${v}</span>`).join("")}${tag==="p"?'<span class="tag w">parziale</span>':""}</div>
  ${g.ident?"":`<div class="w">Titolare non identificato: puoi aggiungere gli elementi al carrello, ma non potrai generare le e-mail finché non associ il codice in Impostazioni › Associa codici titolare.</div>`}
  ${g.codes.size>1&&g.ident?`<div class="m">Più codici associati a questo nome: verifica nelle impostazioni.</div>`:""}
  <table class="items">${g.items.map(r=>{const k=r.__k,inc=cartHas(k);return `<tr><td class="k"><input type="checkbox" data-k="${k}" ${inc?"disabled":""} onchange="selItem('${k}',this.checked)"></td><td>${esc(r[m.ricerca])}</td><td>${esc(r[m.nome])}</td><td>${esc(r[m.tipo])}</td><td>${inc?'<span class="tag ok">già nel carrello</span>':""}</td></tr>`}).join("")}</table></div>`};
 const gs=Object.values(RES.g);
 h+=gs.filter(g=>g._id[0]==="e").map(g=>drawG(g,"e")).join("");
 if(pa.length)h+=`<h3>Corrispondenze parziali</h3>`+gs.filter(g=>g._id[0]==="p").map(g=>drawG(g,"p")).join("");
 if(gs.length)h+=`<div class="bar"><span id="selinfo"></span><button class="p" id="addc" onclick="addToCart()">Aggiungi al carrello</button><button onclick="openCart()">Apri carrello (<span class="cn">${CART.length}</span>)</button><span class="m">${esc(window._am||"")}</span></div>`;
 el.innerHTML=h;updSel()}
function selItem(k,on){on?SEL.add(k):SEL.delete(k);updSel()}
function selGroup(id,on){const g=RES.g[id];g.items.forEach(r=>{if(cartHas(r.__k))return;on?SEL.add(r.__k):SEL.delete(r.__k)});updSel()}
function updSel(){if(!RES||!RES.g)return;
 document.querySelectorAll("#res input[data-k]").forEach(i=>{i.checked=SEL.has(i.dataset.k)});
 Object.values(RES.g).forEach(g=>{const el=document.getElementById("gc_"+g._id);if(!el)return;const av=g.items.filter(r=>!cartHas(r.__k)),n=av.filter(r=>SEL.has(r.__k)).length;
  el.disabled=!av.length;el.checked=av.length>0&&n===av.length;el.indeterminate=n>0&&n<av.length});
 const s=$("#selinfo");if(s)s.textContent=SEL.size?SEL.size+" elementi selezionati":"Nessun elemento selezionato";const b=$("#addc");if(b)b.disabled=!SEL.size}

/* ============ CARRELLO ============ */
function addToCart(){if(!RES||!SEL.size)return;const m=cfg_m();let add=0,dup=0;
 Object.values(RES.g).forEach(g=>g.items.forEach(r=>{const k=r.__k;if(!SEL.has(k))return;if(cartHas(k)){dup++;return}
  CART.push({key:k,code:nv(r[m.tit]),q:RES.q,ricerca:nv(r[m.ricerca]),nome:nv(r[m.nome]),tipo:nv(r[m.tipo]),raw:{...r}});add++}));
 SEL=new Set();window._am=`${add} elementi aggiunti al carrello`+(dup?` (${dup} già presenti, non duplicati)`:"")+". Puoi continuare a cercare.";
 renderRes();updCartBtn();if($("#ct.on"))renderCart()}
function updCartBtn(){const b=$("#cb");if(b)b.textContent=`Carrello (${CART.length})`;document.querySelectorAll(".cn").forEach(e=>e.textContent=CART.length)}
function cartGroups(){const g={};
 CART.forEach(it=>{const n=it.code?ownerName(it.code):"",key=n?"N:"+n:"X:"+(it.code||"(senza codice)");
  const o=g[key]||(g[key]={name:n||"Titolare non identificato",ident:!!n,codes:new Set(),items:[]});o.codes.add(it.code||"(senza codice)");o.items.push(it)});
 return Object.values(g).sort((a,b)=>b.ident-a.ident||a.name.localeCompare(b.name))}
function openCart(){STAGE="cart";$("#ct").classList.add("on");renderCart()}
function closeCart(){$("#ct").classList.remove("on")}
function goOwners(){closeCart();openSettings("own")}
function toReview(){if(!CART.length)return;STAGE="review";renderCart()}
function rmCart(k){CART=CART.filter(x=>x.key!==k);if(!CART.length)STAGE="cart";renderCart();renderRes();updCartBtn()}
function clearCart(){if(!CART.length)return;if(!confirm(`Svuotare il carrello (${CART.length} elementi)?`))return;CART=[];REV={};STAGE="cart";renderCart();renderRes();updCartBtn()}
function showDet(k){const it=CART.find(x=>x.key===k);if(!it)return;
 $("#dtb").innerHTML=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Dettagli elemento</h2><button onclick="$('#dt').classList.remove('on')">Chiudi</button></div><table>${Object.entries(it.raw).map(([a,b])=>`<tr><th>${esc(a)}</th><td>${esc(b)}</td></tr>`).join("")}</table>`;$("#dt").classList.add("on")}
function renderCart(){const el=$("#ctb");if(!el)return;
 if(STAGE==="review"&&CART.length){renderReview();return}STAGE="cart";
 let h=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Carrello</h2><button onclick="closeCart()">Torna alla ricerca</button></div>`;
 if(!CART.length){el.innerHTML=h+`<p class="m">Il carrello è vuoto. Cerca un codice, seleziona gli elementi e premi «Aggiungi al carrello».</p>`;return}
 const gs=cartGroups(),un=gs.filter(g=>!g.ident);
 h+=`<p class="big"><b>${CART.length}</b> elementi · <b>${gs.length}</b> titolari coinvolti</p>`;
 if(un.length)h+=`<div class="card w">⚠ Il carrello contiene elementi di titolari non identificati (codici: ${un.map(g=>[...g.codes].map(esc).join(", ")).join("; ")}). Non è possibile generare le e-mail finché non completi l'associazione del codice titolare nelle impostazioni, oppure rimuovi quegli elementi. <button onclick="goOwners()">Associa codici titolare</button></div>`;
 gs.forEach(g=>{h+=`<div class="card grp ${g.ident?"":"dis"}"><div class="row"><b class="big">${esc(g.name)}</b> <span class="tag">cod. ${[...g.codes].map(esc).join(", ")}</span><span class="tag">${g.items.length} elementi</span></div>
 <table><tr><th>Elemento (NOME_ELEMENTO)</th><th>Codice di ricerca</th><th>Tipologia</th><th></th></tr>${g.items.map(it=>`<tr><td>${it.nome?esc(it.nome):'<span class="w">(senza nome)</span>'}</td><td>${esc(it.ricerca)}</td><td>${esc(it.tipo)}</td><td><button onclick="showDet('${it.key}')">Dettagli</button> <button onclick="rmCart('${it.key}')">Rimuovi</button></td></tr>`).join("")}</table></div>`});
 h+=`<div class="row"><button class="p" onclick="toReview()" ${un.length?"disabled":""}>Conferma e controlla il riepilogo</button><button onclick="clearCart()">Svuota carrello</button><button onclick="closeCart()">Torna alla ricerca</button></div><div class="m">Nessuna e-mail viene generata né inviata finché non confermi. Il carrello è temporaneo e non viene salvato né esportato.</div>`;
 el.innerHTML=h}

/* ============ DESTINATARI DELLE BOZZE ============ */
const mlOK=()=>!!(S.ml.on&&S.ml.email&&isMail(S.ml.email));
const mlFlags=v=>({a:v==="A"||v==="A+CC",c:v==="CC"||v==="A+CC"});
const mlStr=(a,c)=>a&&c?"A+CC":a?"A":c?"CC":"NESSUNO";
const mlFor=n=>mlFlags(S.mlSel[n]!==undefined?S.mlSel[n]:S.ml.def); // scelta del titolare, altrimenti predefinito globale

  if(!els.length){alert("Nessun NOME_ELEMENTO disponibile per "+g.name+": non genero bozze vuote.");return}

  out.push({titolare:g.name,to:L.a.join(", "),cc:L.c.join(", "),subject:fill(S.tpl.subject,v),body:fill(S.tpl.body,v),n:els.length})}

 cfgMsg(`<span class="ok">Configurazione esportata in «configurazione_piena_efficienza.json»: ${o.associazioni.length} associazioni, ${o.destinatari.reduce((n,d)=>n+d.contatti.length,0)} contatti, mailing list ufficio ${o.mailingListUfficio.email?"inclusa":"non configurata"}.</span>`)}
 catch(e){alert("Esportazione non riuscita: "+e.message)}}
function parseCfg(o){const err=[],warn=[];

 if(!Number.isInteger(o.versione)||o.versione<1)return{err:["Versione del formato mancante o non valida."]};
 if(o.versione>CFG_VER)return{err:[`Il file usa la versione ${o.versione} del formato, più recente di quella supportata (${CFG_VER}): aggiorna l'applicazione.`]};
 if(!["associazioni","destinatari","mailingListUfficio"].some(k=>k in o))return{err:["Nessuna sezione di configurazione riconosciuta nel file."]};
 const assoc={},contacts={},mlSel={};let ml=null;
 if("associazioni" in o){if(!Array.isArray(o.associazioni))err.push("La sezione «associazioni» non è un elenco valido.");
  else o.associazioni.forEach((a,i)=>{const c=nv(a&&a.codice),n=nv(a&&a.ragioneSociale);
   if(!c||!n){warn.push(`Associazione n. ${i+1} incompleta: ignorata.`);return}
   if(assoc[c]!==undefined&&assoc[c]!==n){err.push(`Il codice ${c} compare con ragioni sociali diverse nel file («${assoc[c]}» e «${n}»).`);return}assoc[c]=n})}
 if("destinatari" in o){if(!Array.isArray(o.destinatari))err.push("La sezione «destinatari» non è un elenco valido.");
  else o.destinatari.forEach((d,i)=>{const n0=nv(d&&d.ragioneSociale);if(!n0){warn.push(`Destinatari n. ${i+1}: ragione sociale mancante, voce ignorata.`);return}
   const n=findName(contacts,n0)||findName(mlSel,n0)||n0;
   if(d.contatti!=null){if(!Array.isArray(d.contatti))warn.push(`${n}: elenco contatti non valido, ignorato.`);
    else d.contatti.forEach((c,j)=>{const em=nv(c&&c.email);if(!isMail(em)){warn.push(`${n}: contatto n. ${j+1} con e-mail mancante o non valida${em?" ("+em+")":""}: ignorato.`);return}
     let def=nv(c.predefinito).toUpperCase();if(!DEFS.includes(def)){warn.push(`${n}: valore A/CC non riconosciuto per ${em}: ignorato.`);def=""}
     const l=contacts[n]=contacts[n]||[],ex=l.find(x=>lc(x.email)===lc(em));
     if(ex){if(ex.def!==def||(nv(c.nome)&&ex.name&&ex.name!==nv(c.nome)))warn.push(`${n}: ${em} compare più volte con valori diversi: mantenuto il primo.`);return}
     l.push({name:nv(c.nome),email:em,def})})}
   if(d.mailingListUfficio!=null){const v=nv(d.mailingListUfficio).toUpperCase();if(MLS.includes(v))mlSel[n]=v;else warn.push(`${n}: scelta mailing list non riconosciuta: ignorata.`)}})}
 if("mailingListUfficio" in o&&o.mailingListUfficio!=null){const m=o.mailingListUfficio;
  if(typeof m!=="object"||Array.isArray(m))warn.push("Sezione mailing list dell'ufficio non valida: ignorata.");
  else{const em=nv(m.email);if(em&&!isMail(em))warn.push(`Mailing list dell'ufficio: indirizzo non valido (${em}): sezione ignorata.`);
   else{let def=nv(m.predefinito).toUpperCase();if(!DEFS.includes(def)){warn.push("Mailing list dell'ufficio: campo predefinito non riconosciuto: ignorato.");def=""}
    ml={on:typeof m.attiva==="boolean"?m.attiva:true,name:nv(m.nome),email:em,def}}}}
 if(err.length)return{err};
 if(!Object.keys(assoc).length&&!Object.keys(contacts).length&&!Object.keys(mlSel).length&&!ml)return{err:["Il file non contiene dati importabili."]};
 return{err:[],warn,D:{assoc,contacts,mlSel,ml}}}
async function pickCfg(f){if(!f)return;
 try{if(f.size>5e6)throw new Error("file troppo grande per essere una configurazione");const o=JSON.parse(await f.text()),p=parseCfg(o);
  if(p.err.length){cfgMsg(`<div class="e"><b>Importazione non eseguita</b> (${esc(f.name)}): ${p.err.map(esc).join(" ")} La configurazione corrente non è stata modificata.</div>`);return}
  IMP={D:p.D,warn:p.warn,name:f.name,ver:o.versione,mode:"merge",res:{}};$("#im").classList.add("on");renderImp()}
 catch(e){cfgMsg(`<div class="e"><b>Importazione non eseguita</b>: file non valido o non leggibile (${esc(e.message)}). La configurazione corrente non è stata modificata.</div>`)}}
const fmtML=m=>`${m.name||"(senza nome)"} <${m.email}> · ${m.on?"attiva":"disattivata"} · predefinito ${DLAB(m.def)}`;
const MLL=v=>v===undefined?"predefinito globale":v==="NESSUNO"?"non includerla":v==="A+CC"?"in A e in CC":"in "+v;
const nCont=c=>Object.values(c).reduce((a,l)=>a+l.length,0);
function planImport(D,mode,res){const st={newO:0,newC:0,sameC:0,newM:0,ml:0};
 if(mode==="replace")return{ns:{owners:{...D.assoc},contacts:clone(D.contacts),mlSel:{...D.mlSel},ml:D.ml?{...D.ml}:{...S.ml}},conf:[],un:0,st};
 const ns={owners:{...S.owners},contacts:clone(S.contacts),mlSel:{...S.mlSel},ml:{...S.ml}},conf=[];
 Object.entries(D.assoc).forEach(([c,n])=>{if(!(c in ns.owners)){ns.owners[c]=n;st.newO++;return}const cur=ns.owners[c];if(lc(cur)===lc(n))return;
  const id="o:"+c;conf.push({id,txt:`Codice titolare ${c}: ragione sociale diversa`,cur,imp:n});if(res[id]==="imp")ns.owners[c]=n});
 Object.entries(D.contacts).forEach(([n0,list])=>{const key=findName(ns.contacts,n0)||n0,tgt=ns.contacts[key]=ns.contacts[key]||[];
  list.forEach(ic=>{const ex=tgt.find(x=>lc(x.email)===lc(ic.email));if(!ex){tgt.push({...ic});st.newC++;return}
   const dc=ex.def&&ic.def&&ex.def!==ic.def,nc=ex.name&&ic.name&&ex.name!==ic.name;
   if(dc||nc){const id="c:"+key+"|"+lc(ex.email);conf.push({id,txt:`${key} — contatto ${ex.email}`,cur:`${ex.name||"(senza nome)"} · predefinito ${DLAB(ex.def)}`,imp:`${ic.name||"(senza nome)"} · predefinito ${DLAB(ic.def)}`});
    if(res[id]==="imp"){ex.name=ic.name||ex.name;ex.def=ic.def||ex.def}}
   if(!ex.name&&ic.name)ex.name=ic.name;if(!ex.def&&ic.def)ex.def=ic.def; // completamento di campi vuoti: nessuna informazione persa
   st.sameC++})});
 Object.entries(D.mlSel).forEach(([n0,v])=>{const key=findName(ns.mlSel,n0)||n0;if(!(key in ns.mlSel)){ns.mlSel[key]=v;st.newM++;return}
  if(ns.mlSel[key]===v)return;const id="m:"+key;conf.push({id,txt:`${key} — mailing list ufficio`,cur:MLL(ns.mlSel[key]),imp:MLL(v)});if(res[id]==="imp")ns.mlSel[key]=v});
 if(D.ml&&D.ml.email){const c=ns.ml;if(!c.email){ns.ml={...D.ml};st.ml=1}
  else if(!(lc(c.email)===lc(D.ml.email)&&c.name===D.ml.name&&c.on===D.ml.on&&c.def===D.ml.def)){conf.push({id:"ml",txt:"Mailing list dell'ufficio (globale)",cur:fmtML(c),imp:fmtML(D.ml)});if(res.ml==="imp")ns.ml={...D.ml}}}
 return{ns,conf,un:conf.filter(c=>res[c.id]===undefined).length,st}}
function impMode(v){IMP.mode=v;renderImp()}
function impRes(i,v){IMP.res[IMPC[i].id]=v;renderImp()}
function impAll(v){IMPC.forEach(c=>IMP.res[c.id]=v);renderImp()}
function closeImp(){IMP=null;$("#im").classList.remove("on")}
function renderImp(){if(!IMP)return;const D=IMP.D,p=planImport(D,IMP.mode,IMP.res);IMPC=p.conf;
 const nA=Object.keys(D.assoc).length,nT=Object.keys(D.contacts).length,nC=nCont(D.contacts),nM=Object.keys(D.mlSel).length;
 const orph=Object.keys(p.ns.contacts).filter(n=>p.ns.contacts[n].length&&!Object.values(p.ns.owners).some(v=>lc(v)===lc(n)));
 let h=`<div class="row" style="justify-content:space-between"><h2 style="margin:0">Importa configurazione</h2><button onclick="closeImp()">Annulla</button></div>
 <p class="m">File: ${esc(IMP.name)} · formato versione ${IMP.ver}. Nulla è stato ancora modificato.</p>
 <div class="card"><b>Contenuto del file</b><br>${nA} associazioni codice–titolare · ${nT} titolari con destinatari (${nC} contatti) · ${nM} scelte mailing list per titolare · mailing list ufficio: ${D.ml&&D.ml.email?esc(fmtML(D.ml)):"non presente"}
 <details><summary>Associazioni</summary><table>${Object.keys(D.assoc).sort(numCmp).map(c=>`<tr><td>${esc(c)}</td><td>${esc(D.assoc[c])}</td></tr>`).join("")||'<tr><td class="m">Nessuna</td></tr>'}</table></details>
 <details><summary>Destinatari</summary><table>${Object.entries(D.contacts).map(([n,l])=>`<tr><td><b>${esc(n)}</b></td><td>${l.map(c=>esc((c.name?c.name+" ":"")+c.email+(c.def?" ["+c.def+"]":""))).join("<br>")}</td></tr>`).join("")||'<tr><td class="m">Nessuno</td></tr>'}</table></details></div>`;
 if(IMP.warn.length)h+=`<div class="card w"><b>Avvisi sul file</b><ul>${IMP.warn.map(w=>`<li>${esc(w)}</li>`).join("")}</ul></div>`;
 h+=`<div class="card"><b>Come applicare la configurazione?</b><div><label><input type="radio" name="imode" ${IMP.mode==="merge"?"checked":""} onchange="impMode('merge')"> <b>Unisci</b> alla configurazione esistente (aggiunge i nuovi codici e contatti senza cancellare i presenti)</label></div>
 <div><label><input type="radio" name="imode" ${IMP.mode==="replace"?"checked":""} onchange="impMode('replace')"> <b>Sostituisci</b> la configurazione esistente con quella del file</label></div></div>`;
 if(IMP.mode==="merge"){h+=`<div class="card">Nuove associazioni: <b>${p.st.newO}</b> · nuovi contatti: <b>${p.st.newC}</b> · contatti già presenti (non duplicati): <b>${p.st.sameC}</b> · nuove scelte mailing list: <b>${p.st.newM}</b>${p.st.ml?" · mailing list ufficio importata":""} · conflitti: <b>${p.conf.length}</b></div>`;
  if(p.conf.length){h+=`<div class="card"><b>Conflitti da risolvere</b> <span class="m">(scegli quale valore mantenere: nulla viene sovrascritto senza la tua scelta)</span> <button onclick="impAll('cur')">Mantieni tutti gli attuali</button> <button onclick="impAll('imp')">Usa tutti gli importati</button>
   ${p.conf.map((c,i)=>`<div class="cfl"><b>${esc(c.txt)}</b><div><label><input type="radio" name="cf${i}" ${IMP.res[c.id]==="cur"?"checked":""} onchange="impRes(${i},'cur')"> Mantieni attuale: ${esc(c.cur)}</label></div><div><label><input type="radio" name="cf${i}" ${IMP.res[c.id]==="imp"?"checked":""} onchange="impRes(${i},'imp')"> Usa importato: ${esc(c.imp)}</label></div></div>`).join("")}</div>`}}
 else{h+=`<div class="card w">⚠ Verranno <b>eliminate</b> le attuali ${Object.keys(S.owners).length} associazioni e ${nCont(S.contacts)} contatti (e le scelte mailing list per titolare), sostituiti da quelli del file.${D.ml?"":" La mailing list ufficio attuale resta invariata (assente nel file)."}</div>`}
 if(orph.length)h+=`<div class="card w">${orph.length} titolari con destinatari non hanno ancora un codice associato (${orph.slice(0,5).map(esc).join(", ")}${orph.length>5?"…":""}): i loro destinatari saranno utilizzabili solo dopo l'associazione di un codice.</div>`;
 h+=`<div class="row"><button class="p" onclick="applyImport()" ${IMP.mode==="merge"&&p.un?"disabled":""}>Applica importazione</button><button onclick="closeImp()">Annulla</button></div>${IMP.mode==="merge"&&p.un?`<div class="w">Risolvi tutti i conflitti per poter applicare.</div>`:""}`;
 $("#imb").innerHTML=h}
function applyImport(){if(!IMP)return;
 try{const p=planImport(IMP.D,IMP.mode,IMP.res);if(IMP.mode==="merge"&&p.un){alert("Risolvi tutti i conflitti prima di applicare.");return}
  if(IMP.mode==="replace"&&!confirm("Sostituire la configurazione esistente con quella importata? Le associazioni e i contatti attuali verranno eliminati."))return;
  const old={owners:S.owners,contacts:S.contacts,mlSel:S.mlSel,ml:S.ml};
  Object.assign(S,p.ns); // tutte le verifiche sono già state eseguite: applicazione in un solo passo
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){Object.assign(S,old);alert("Salvataggio non riuscito: la configurazione precedente è stata conservata.");return}
  const mode=IMP.mode;closeImp();
  cfgMsg(`<span class="ok">Configurazione importata (${mode==="replace"?"sostituzione":"unione"}): ora ${Object.keys(S.owners).length} associazioni e ${nCont(S.contacts)} contatti.</span>`);
  render();if($("#st.on"))renderSettings();if($("#ct.on"))renderCart()}
 catch(e){alert("Importazione non applicata, configurazione invariata: "+e.message)}}
