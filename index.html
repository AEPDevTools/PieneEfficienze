const LS="vpe_v1",D0={cfg:{mappa:{...MAP0},filtri:{comp:"03",tens:"4"}},owners:{},contacts:{},tpl:{...TPL0},linea:"linea 132 kV n. 875 PS Servola-Broletto",periodo:"",ml:{on:true,name:"Mailing list ufficio",email:"",def:""},mlSel:{}};

let V="home",TAB="cols",DB={ok:false,name:"",sheet:"",rows:[],headers:[],valid:[],missing:[],noTit:0},PEND=null,RES=null,SEL=new Set(),CART=[],Q="",MAIL=null,RN=[],TA=null,TT;
/* ===== navigazione ===== */
function go(v){V=v;({home:home,set:sett,mail:mail})[v]()}
const head=sub=>`<header class="w hd"><div><h1>Piene efficienze</h1><h2>${sub}</h2></div><div class="ic"><button class="${V==="mail"?"dm":""}" ${V==="mail"?"disabled":""} title="Impostazioni" onclick="go(V==='set'?'home':'set')">${I.gear}</button><button class="${V==="set"?"dm":""}" title="Home" onclick="go('home')">${I.logo}</button></div></header>`;
function toast(m,a){TA=a||null;const t=$("#ts");t.innerHTML=esc(m)+(a?` <button class="mini" onclick="TA();$('#ts').classList.remove('on')">Apri</button>`:"");t.classList.add("on");clearTimeout(TT);TT=setTimeout(()=>t.classList.remove("on"),a?9000:4500)}
const ov=h=>{$("#ovb").innerHTML=h+`<p><button class="mini" onclick="$('#ov').classList.remove('on')">Chiudi</button></p>`;$("#ov").classList.add("on")};
/* ===== database ===== */
async function pickFile(f){if(!f)return;try{if(typeof XLSX==="undefined")throw Error("libreria SheetJS non disponibile (connessione assente?)");const wb=XLSX.read(await f.arrayBuffer(),{type:"array",cellFormula:false,cellDates:false});PEND={wb,name:f.name};wb.SheetNames.length===1?applySheet(wb.SheetNames[0]):go(V)}catch(e){toast("File non leggibile (database precedente conservato): "+e.message)}}
function applySheet(sh){try{const a=XLSX.utils.sheet_to_json(PEND.wb.Sheets[sh],{defval:"",raw:true});if(!a.length)throw Error("il foglio è vuoto");a.forEach((r,i)=>Object.defineProperty(r,"__k",{value:"r"+i}));const h=Object.keys(a[0]),g={};for(const k in FIELDS){const w=lc(mp()[k]||MAP0[k]);g[k]=h.find(x=>lc(x)===w)||""}

 Q=$("#q").value;const q=nv(Q),m=mp();RES=null;SEL=new Set();if(q&&DB.ok&&!DB.missing.length){const ex=[],pa=[];DB.valid.forEach(r=>{const v=nv(r[m.ricerca]);if(eq(v,q))ex.push(r);else if(lc(v).includes(lc(q)))pa.push(r)});RES={q,ex,pa}}renderRes();updBar()}

function addCart(){if(!RES||!SEL.size)return;const m=mp();let n=0;RES.gs.forEach(g=>g.items.forEach(r=>{if(SEL.has(r.__k)&&!inCart(r.__k)){CART.push({key:r.__k,code:nv(r[m.tit]),q:RES.q,ricerca:nv(r[m.ricerca]),nome:nv(r[m.nome])});n++}}));SEL=new Set();toast(`${n} elementi aggiunti al carrello. Puoi continuare a cercare.`);renderRes()}
function updBar(){const c=$("#cn"),a=$("#ad"),v=$("#av");if(!c)return;c.textContent=CART.length;a.disabled=!SEL.size;a.className=SEL.size?"rd":"";v.disabled=!CART.length;v.className=CART.length?"rd":""}
function cgroups(){const g={};CART.forEach(it=>{const n=it.code?S.owners[it.code]||"":"",k=n?"N:"+n:"X:"+(it.code||"-"),o=g[k]||(g[k]={name:n||"Titolare non identificato",ident:!!n,codes:new Set(),items:[]});o.codes.add(it.code||"(senza codice)");o.items.push(it)});return Object.values(g).sort((a,b)=>b.ident-a.ident||a.name.localeCompare(b.name))}
function cartPop(){ov(`<h3>Carrello (${CART.length})</h3>`+(CART.length?cgroups().map(g=>`<b>${esc(g.name)}</b>`+g.items.map(it=>`<div class="cr"><span>${esc(it.nome||it.ricerca)}</span><button class="mini" onclick="rmCart('${it.key}')">Rimuovi</button></div>`).join("")).join("")+`<p><button class="mini" onclick="CART=[];afterCart()">Svuota carrello</button></p>`:`<p class="em">Il carrello è vuoto.</p>`))}
function rmCart(k){CART=CART.filter(x=>x.key!==k);afterCart()}

function next(){if(!CART.length)return;const gs=cgroups();
 if(gs.some(g=>!g.ident)){toast("Il carrello contiene titolari non identificati: associa i codici titolare.",()=>{TAB="own";go("set")});return}
 if(gs.some(g=>!g.items.some(i=>i.nome))){toast("Un titolare non ha nessun NOME_ELEMENTO: controlla le colonne in Configura DB.");return}
 MAIL={gs,i:0,sent:{},rv:{}};go("mail")}
/* ===== INVIO EMAIL ===== */
const ORD=["Prima","Seconda","Terza","Quarta","Quinta","Sesta","Settima","Ottava","Nona","Decima"];
function rows(g){const k=g.name;if(!MAIL.rv[k]){const r=(S.contacts[k]||[]).map(c=>({n:c.name,e:c.email,a:c.def==="A",c:c.def==="CC"}));if(mlOK()){const f=mlFlags(S.mlSel[k]!==undefined?S.mlSel[k]:S.ml.def);r.push({n:S.ml.name||"Mailing list ufficio",e:S.ml.email,a:f.a,c:f.c})}MAIL.rv[k]=r}return MAIL.rv[k]}
function mail(){document.body.className="sub";const M=MAIL,g=M.gs[M.i],r=rows(g),els=uniq(g.items.map(i=>i.nome).filter(Boolean));
 $("#app").innerHTML=head("Invio email")+`<section class="w card"><div class="tabrow"><div class="tabs">${M.gs.map((x,j)=>`<button class="tab ${j===M.i?"on":""}" onclick="MAIL.i=${j};mail()">${ORD[j]?ORD[j]+" email":"Email "+(j+1)}${M.sent[x.name]?" ✓":""}</button>`).join("")}</div></div>
 <div class="bd sc"><b>${esc(g.name)}</b><div class="sm">cod. ${[...g.codes].map(esc).join(", ")} · ${els.length} elementi selezionati</div><ul class="el">${els.map(e=>`<li>${esc(e)}</li>`).join("")}</ul>
 <table class="rt"><tr><th>Destinatari:</th><th>A:</th><th>CC:</th></tr>${r.map((x,j)=>`<tr><td>${esc(x.e)}${x.n?` <span class="sm">${esc(x.n)}</span>`:""}</td><td><input type="checkbox" class="ck" ${x.a?"checked":""} onchange="rows(MAIL.gs[MAIL.i])[${j}].a=this.checked"></td><td><input type="checkbox" class="ck" ${x.c?"checked":""} onchange="rows(MAIL.gs[MAIL.i])[${j}].c=this.checked"></td></tr>`).join("")}</table>${r.length?"":'<p class="sm">Nessun destinatario configurato: li inserirai direttamente in Outlook.</p>'}</div></section>
 <div class="bar bm"><input class="fld" placeholder="Inserisci linea fuori servizio..." value="${esc(S.linea)}" onchange="S.linea=this.value;save()"><input id="per" class="fld" placeholder="Periodo lavori..." value="${esc(S.periodo)}" onchange="S.periodo=this.value;save()"><button class="snd" onclick="send()" title="Apri la bozza in Outlook">${I.send}${M.i+1} di ${M.gs.length}</button></div>`}
function send(){const M=MAIL,g=M.gs[M.i];const per=$("#per");S.periodo=per.value;save();
 if(!nv(S.periodo)){toast("Inserisci il periodo dei lavori.");per.focus();return}if(!nv(S.linea)){toast("Inserisci la linea fuori servizio.");return}
 const r=rows(g),A=uniq(r.filter(x=>x.a&&x.e).map(x=>x.e)),C=uniq(r.filter(x=>x.c&&x.e).map(x=>x.e)),dup=A.filter(e=>C.some(x=>lc(x)===lc(e)));
 if(dup.length&&!confirm("Presenti sia in A sia in CC: "+dup.join(", ")+". Aprire comunque la bozza?"))return;
 const els=uniq(g.items.map(i=>i.nome).filter(Boolean)),v={TITOLARE:g.name,CODICE_TITOLARE:[...g.codes].join(", "),CODICE_RICERCA:uniq(g.items.map(i=>i.q)).join(", "),ELENCO_ELEMENTI:els.map(e=>"- "+e+";").join("\n"),LINEA_FUORI_SERVIZIO:S.linea,PERIODO_LAVORI:S.periodo};
 const fill=t=>t.replace(/\{\{(\w+)\}\}/g,(x,k)=>k in v?v[k]:x),sub=fill(S.tpl.subject),body=fill(S.tpl.body),nl=t=>encodeURIComponent(t.replace(/\r?\n/g,"\r\n"));
 const u="mailto:"+A.map(encodeURIComponent).join(",")+"?subject="+nl(sub)+(C.length?"&cc="+C.map(encodeURIComponent).join(","):"")+"&body="+nl(body);let msg="Bozza inviata a Outlook: controllala e inviala.";
 if(u.length>1900){try{navigator.clipboard.writeText(`A: ${A.join(", ")}\nCC: ${C.join(", ")}\nOggetto: ${sub}\n\n${body}`)}catch(e){}msg="Testo molto lungo: il client potrebbe troncarlo, l'e-mail è stata copiata negli appunti."}
 location.href=u;M.sent[g.name]=1;const nx=M.gs.findIndex((x,j)=>j>M.i&&!M.sent[x.name]);if(nx>=0)M.i=nx;mail();toast(msg)}
/* ===== SETTINGS PANEL ===== */
const TABS={cols:"Configura DB",own:"Associa codici titolare",rec:"Destinatari email",tpl:"Modello email"};
function sett(){document.body.className="sub";RN=[];
 $("#app").innerHTML=head("Settings panel")+`<section class="w card"><div class="tabrow"><div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button class="tab ${k===TAB?"on":""}" onclick="TAB='${k}';sett()">${v}</button>`).join("")}</div><button class="rb" title="Esporta configurazione" onclick="exportCfg()">${I.dl}</button><button class="rb" title="Importa configurazione" onclick="$('#fc').click()">${I.imp}</button></div><div class="bd sc">${({cols:tCols,own:tOwn,rec:tRec,tpl:tTpl})[TAB]()}</div></section><div class="bar off"><button>${I.cart}Aggiungi</button><button>${I.arrow}Avanti</button></div>`;
 const t=$(".tabs");t.scrollLeft=$(".tab.on").offsetLeft-4}
function tCols(){if(!DB.ok)return "<p>Carica prima un database dalla home.</p>";const m=mp(),f=S.cfg.filtri;
 return `<table><tr><th>Campo</th><th>Colonna</th><th>Stato</th></tr>${Object.entries(FIELDS).map(([k,[l,req]])=>{const ok=m[k]&&DB.headers.includes(m[k]);return `<tr><td>${l}${req?" *":""}</td><td><select class="sel" onchange="mp()['${k}']=this.value;save();recompute();sett()"><option value="">— nessuna —</option>${DB.headers.map(h=>`<option ${h===m[k]?"selected":""}>${esc(h)}</option>`).join("")}</select></td><td class="${ok?"ok":req?"er":""}">${ok?"OK":"Mancante"}</td></tr>`}).join("")}</table>
 <h3>Filtri</h3><div class="row"><label>Codice competente = <input class="fld" size="5" value="${esc(f.comp)}" onchange="S.cfg.filtri.comp=this.value;save();recompute();sett()"></label><label>Livello tensione = <input class="fld" size="5" value="${esc(f.tens)}" onchange="S.cfg.filtri.tens=this.value;save();recompute();sett()"></label></div><p>Data fine validità: vuota. Righe che superano i filtri: ${DB.valid.length} su ${DB.rows.length}.</p>`}
function tOwn(){if(!DB.ok||DB.missing.length)return "<p>Configura prima il database.</p>";const m=mp(),o={};
 DB.valid.forEach(r=>{const c=nv(r[m.tit]);if(!c)return;const e=o[c]||(o[c]={n:0,rs:{}});e.n++;const rs=nv(r[m.rs]);if(rs)e.rs[rs]=(e.rs[rs]||0)+1});
 const f=lc(window._of||""),cs=Object.keys(o).sort(nc),nA=cs.filter(c=>S.owners[c]).length;
 return `<p><b>${cs.length}</b> codici · <b>${nA}</b> associati · <b>${cs.length-nA}</b> da associare</p><input class="fld" placeholder="Cerca codice o nome…" value="${esc(window._of||"")}" onchange="window._of=this.value;sett()"><table><tr><th>Codice</th><th>Ragione sociale nel DB</th><th>Elementi</th><th>Titolare</th><th></th></tr>${cs.filter(c=>!f||lc(c).includes(f)||lc(S.owners[c]||"").includes(f)).map(c=>{const e=o[c],rs=Object.entries(e.rs).sort((a,b)=>b[1]-a[1]),prop=!S.owners[c]&&rs.length===1?rs[0][0]:"";
 return `<tr><td>${esc(c)}</td><td>${rs.map(([k,v])=>`${esc(k)} (${v})`).join("<br>")||"—"}${rs.length>1?'<div class="sm">Valori discordanti: scegli tu.</div>':""}</td><td>${e.n}</td><td><input class="fld" id="o_${esc(c)}" value="${esc(S.owners[c]||prop)}" placeholder="${prop?"proposta":""}"></td><td><button class="mini" onclick="setOwner('${esc(c)}')">${prop?"Conferma":"Salva"}</button></td></tr>`}).join("")}</table>`}
function setOwner(c){const v=nv(document.getElementById("o_"+c).value);v?S.owners[c]=v:delete S.owners[c];save();sett()}
function tRec(){const names=uniq(Object.values(S.owners)).sort(),m=S.ml;RN=names;
 const sel=(o,cur)=>o.map(([v,t])=>`<option value="${v}" ${cur===v?"selected":""}>${t}</option>`).join("");
 let h=`<div class="bx"><b>Mailing list dell'ufficio</b> <span class="sm">(contatto globale, aggiungibile alle bozze di ogni titolare)</span><div class="row"><input class="fld" value="${esc(m.name)}" placeholder="Nome descrittivo" onchange="setML('name',this.value)"><input class="fld" value="${esc(m.email)}" placeholder="Indirizzo e-mail" onchange="setML('email',this.value)"><label class="row"><input type="checkbox" class="ck" ${m.on?"checked":""} onchange="setML('on',this.checked)"> Attiva</label><select class="sel" onchange="setML('def',this.value)">${sel([["","Non selezionato"],["A","A"],["CC","CC"]],m.def)}</select></div></div>`;
 if(!names.length)return h+"<p>Associa prima almeno un codice a un titolare.</p>";
 return h+names.map((n,k)=>{const l=S.contacts[n]||[],sv=S.mlSel[n];return `<div class="bx"><b>${esc(n)}</b><table>${l.map((c,i)=>`<tr><td>${esc(c.name||"")}</td><td>${esc(c.email)}</td><td><select class="sel" onchange="setDef(${k},${i},this.value)">${sel([["","—"],["A","A"],["CC","CC"]],c.def||"")}</select></td><td><button class="mini" onclick="delC(${k},${i})">Elimina</button></td></tr>`).join("")}</table>
 <div class="row"><input class="fld" id="cn_${k}" placeholder="Nome (facoltativo)"><input class="fld" id="ce_${k}" placeholder="E-mail"><select class="sel" id="cd_${k}"><option value="">—</option><option>A</option><option>CC</option></select><button class="mini" onclick="addC(${k})">Aggiungi</button></div>
 ${mlOK()?`<div class="row">Mailing list ufficio: <select class="sel" onchange="setMlSel(${k},this.value)">${sel([["","Predefinito globale"],["A","In A"],["CC","In CC"],["A+CC","In A e in CC"],["NESSUNO","Non includerla"]],sv===undefined?"":sv)}</select></div>`:""}</div>`}).join("")}
function setML(f,v){if(f==="email"){v=nv(v);if(v&&!isMail(v)){toast("Indirizzo e-mail non valido");sett();return}S.ml.email=v}else if(f==="name")S.ml.name=nv(v);else if(f==="on")S.ml.on=!!v;else S.ml.def=["A","CC"].includes(v)?v:"";save();sett()}
function setMlSel(k,v){v===""?delete S.mlSel[RN[k]]:S.mlSel[RN[k]]=v;save();sett()}
function setDef(k,i,v){S.contacts[RN[k]][i].def=["A","CC"].includes(v)?v:"";save();sett()}
function delC(k,i){S.contacts[RN[k]].splice(i,1);save();sett()}
function addC(k){const n=RN[k],e=nv(document.getElementById("ce_"+k).value);if(!isMail(e)){toast("Indirizzo e-mail non valido");return}const l=S.contacts[n]=S.contacts[n]||[];if(l.some(c=>lc(c.email)===lc(e))){toast("Indirizzo già presente per questo titolare");return}l.push({name:nv(document.getElementById("cn_"+k).value),email:e,def:document.getElementById("cd_"+k).value});save();sett()}
function tTpl(){return `<p>Oggetto</p><input class="fld" style="width:100%" value="${esc(S.tpl.subject)}" onchange="S.tpl.subject=this.value;save()"><p>Corpo</p><textarea onchange="S.tpl.body=this.value;save()">${esc(S.tpl.body)}</textarea>
 <div class="row"><button class="mini" onclick="if(confirm('Ripristinare il modello predefinito?')){S.tpl={...TPL0};save();sett()}">Ripristina modello predefinito</button></div>
 <p class="sm">Segnaposto: {{TITOLARE}} · {{CODICE_TITOLARE}} · {{CODICE_RICERCA}} · {{ELENCO_ELEMENTI}} · {{LINEA_FUORI_SERVIZIO}} · {{PERIODO_LAVORI}}</p>`}
/* ===== esporta / importa configurazione (formato vpe-config v1, compatibile con i file già esportati) ===== */
function exportCfg(){const nm=uniq([...Object.keys(S.contacts),...Object.keys(S.mlSel)]).sort(),cd=n=>Object.keys(S.owners).filter(c=>S.owners[c]===n);
 const o={formato:"vpe-config",versione:1,esportatoIl:new Date().toISOString(),associazioni:Object.keys(S.owners).sort(nc).map(c=>({codice:c,ragioneSociale:S.owners[c]})),
 destinatari:nm.filter(n=>(S.contacts[n]||[]).length||S.mlSel[n]!==undefined).map(n=>({ragioneSociale:n,codici:cd(n),contatti:(S.contacts[n]||[]).map(c=>({nome:c.name||"",email:c.email,predefinito:c.def||""})),mailingListUfficio:S.mlSel[n]!==undefined?S.mlSel[n]:null})),
 mailingListUfficio:{attiva:!!S.ml.on,nome:S.ml.name||"",email:S.ml.email||"",predefinito:S.ml.def||""}};
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o,null,2)],{type:"application/json"}));a.download="configurazione_piena_efficienza.json";document.body.appendChild(a);a.click();a.remove();toast("Configurazione esportata.")}
async function pickCfg(f){if(!f)return;try{const o=JSON.parse(await f.text());if(o.formato!=="vpe-config"||o.versione!==1)throw Error("formato non riconosciuto");let a=0,c=0;
 (o.associazioni||[]).forEach(x=>{const k=nv(x.codice),n=nv(x.ragioneSociale);if(k&&n&&!(k in S.owners)){S.owners[k]=n;a++}});
 (o.destinatari||[]).forEach(d=>{const n0=nv(d.ragioneSociale);if(!n0)return;const n=Object.keys(S.contacts).find(k=>lc(k)===lc(n0))||n0,l=S.contacts[n]=S.contacts[n]||[];
  (d.contatti||[]).forEach(x=>{const e=nv(x.email),df=nv(x.predefinito).toUpperCase();if(isMail(e)&&!l.some(y=>lc(y.email)===lc(e))){l.push({name:nv(x.nome),email:e,def:["A","CC"].includes(df)?df:""});c++}});
  if(["A","CC","A+CC","NESSUNO"].includes(d.mailingListUfficio)&&!(n in S.mlSel))S.mlSel[n]=d.mailingListUfficio});
 const m=o.mailingListUfficio;if(m&&isMail(nv(m.email))&&!S.ml.email)S.ml={on:m.attiva!==false,name:nv(m.nome),email:nv(m.email),def:["A","CC"].includes(m.predefinito)?m.predefinito:""};
 save();recompute();toast(`Importate ${a} associazioni e ${c} contatti nuovi (unione: nulla è stato sovrascritto).`);go(V)}catch(e){toast("Importazione non eseguita: "+e.message)}}
go("home");
